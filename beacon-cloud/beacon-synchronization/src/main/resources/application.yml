# 服务名称
spring:
  application:
    name: beacon-synchronization
# 多环境
  profiles:
    active: dev
# nacos注册中心地址
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.113.3:8848
# nacos配置中心地址
      config:
        server-addr: 192.168.113.3:8848
        file-extension: yml
        # beacon-cache-dev.yml
# datasource
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.113.3:3306/beacon_cloud?useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
# 端口号
server:
  port: 20000
# mybatis
mybatis:
  configuration:
    map-underscore-to-camel-case: true
