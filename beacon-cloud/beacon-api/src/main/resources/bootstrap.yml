# 服务名称
spring:
  application:
    name: beacon-api
# 多环境
  profiles:
    active: dev
# nacos注册中心地址
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.113.3:8848
# nacos配置中心地址
      config:
        server-addr: 192.168.113.3:8848
        file-extension: yml
        # beacon-api-dev.yml
# RabbitMQ连接信息
  rabbitmq:
    host: 192.168.113.3
    port: 5672
    username: guest
    password: guest
    virtual-host: /
